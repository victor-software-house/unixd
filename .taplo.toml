  "target/**",
  ".miserc.toml",
  "committed.toml",
  "mise.dev.toml",
  "mise.ci.toml",
  "mise.template.toml",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "clippy.toml",
  "deny.toml",
  "mise-tasks/commits.toml",
  "mise-tasks/hooks.toml",
  "mise-tasks/repo.toml",
]
