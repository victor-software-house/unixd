# Spelling, checked by `mise run lint:typos`.
[default]
# A changelog links each entry to its commit as [`abc1234`](…).
# A hash is not a word, yet a short one can spell a typo, such as 71c9abd.
extend-ignore-re = ["\\[`[0-9a-f]{7,40}`\\]"]

[files]
extend-exclude = ["*.lock"]

# Tests and specs misspell a field name on purpose, to prove a config with an
# unknown field is rejected.
[default.extend-words]
idel = "idel"
timeuot = "timeuot"
entires = "entires"
