name: CI

on:
  # A draft pull request runs no CI; marking it ready starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The queue tests each entry on top of the ones ahead of it, so a push to
  # the default branch has already passed and runs nothing.
  merge_group:
  # A merge_group run saves its build cache on its queue branch, which no pull
  # request can restore from, and a schedule run saves none, so the daily
  # refresh job dispatches this workflow on the default branch, whose run
  # saves the cache pull requests restore from.
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # A check:versions task reads a pull request that changes a manifest
  # version, to tell the Version PR apart from a hand edit.
  pull-requests: read

concurrency:
  # One run per branch: a new push, or a retarget after the base merges,
  # cancels the run it replaces, on the default branch as on a pull request.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'schedule'
    # One API call: a GitHub-hosted runner, which bills no Namespace units.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          workflow=${WORKFLOW%@*}
          gh workflow run "${workflow##*/}" --repo "$REPOSITORY" --ref main

  # The shared workflow runs verify, picks the runner from this repository's
  # visibility, and caches builds with mbx.
  verify:
    if: ${{ !github.event.pull_request.draft && github.event_name != 'schedule' }}
    uses: victor-software-house/actions/.github/workflows/rust-ci.yml@444c20944bb46cf90583931dbfb5678227dff774 # main, 2026-10-24
    with:
      mise-version: 2026.10.17
      advisories: true
      semver: true
      timeout-minutes: 8
