name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # Refresh the default branch's build cache without repeating every push.
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'schedule'
    # One API call on the runner chosen when this repository was rendered.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          workflow=${WORKFLOW%@*}
          gh workflow run "${workflow##*/}" --repo "$REPOSITORY" --ref main

  verify:
    if: ${{ !github.event.pull_request.draft && github.event_name != 'schedule' }}
    uses: victor-software-house/actions/.github/workflows/rust-ci.yml@6e9dd33a97807e6e7437cb06b9c0310d674534ea # main, 2026-11-02
    with:
      mise-version: 2026.10.25
      advisories: true
      semver: true
      timeout-minutes: 8
      build-runner: '["ubuntu-latest"]'
      read-only-runner: '["ubuntu-latest"]'
      light-runner: ubuntu-latest
      cache-volume: false
