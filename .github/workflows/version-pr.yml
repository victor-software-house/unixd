name: Version PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # `dev` for the toolchain prepare.after needs, `release` for verctl.
  MISE_ENV: dev,release

concurrency:
  group: version-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Install locked toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.13
          cache: true
      - uses: victor-software-house/verctl/actions/version-pr@25df3c4d374f22fb98eb694baa51dd8ac419b202 # v0.3.3
