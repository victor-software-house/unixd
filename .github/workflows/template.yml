name: Template

on:
  # A draft pull request runs no check; marking it ready starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # A tag reaches the repository through this run's issue, not through a
  # failing pull request.
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: template-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Fails an update pull request that does not reach the newest template tag.
  # Any other pull request gets a notice; a push or the schedule keeps an issue
  # open while the newest tag would change this repository. The shared
  # workflow reads the template with the organization's reader App, so it
  # takes that App's key and no other secret.
  template:
    if: ${{ !github.event.pull_request.draft }}
    uses: victor-software-house/actions/.github/workflows/template-check.yml@1f79b4ff5eff1221289dad0baaf1b562037fc528 # main, 2026-10-23
    permissions:
      contents: read
      issues: write
    with:
      mise-version: 2026.10.17
    secrets:
      TEMPLATES_APP_PRIVATE_KEY: ${{ secrets.TEMPLATES_APP_PRIVATE_KEY }}
