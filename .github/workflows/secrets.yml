name: Secrets

on:
  # A pull request scans its own commits; the pre-push hook scanned only the
  # commits it pushed. A draft pull request runs no scan.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The whole history, once a day.
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A draft run gets a group of its own, so it never cancels the ready run.
  group: >-
    secrets-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}${{
    github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

jobs:
  # The shared workflow runs gitleaks from this repository's mise.dev.toml
  # through its hooks:secrets:history task.
  secrets:
    if: ${{ !github.event.pull_request.draft }}
    uses: victor-software-house/actions/.github/workflows/secrets.yml@5ad08e7382a53bd35c65fc1e1aaa1c2fae427ed9 # main, 2026-11-14
    # The mise action exchanges the OIDC token for the mirror's session token.
    permissions:
      contents: read
      id-token: write
    with:
      mise-version: 2026.11.6
      runner: ubuntu-26.04
    secrets:
      RELEASE_MIRROR_URL: ${{ secrets.RELEASE_MIRROR_URL }}
      RELEASE_MIRROR_CI_KEY: ${{ secrets.RELEASE_MIRROR_CI_KEY }}
