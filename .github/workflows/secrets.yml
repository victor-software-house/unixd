name: Secrets

on:
  # A pull request scans its own commits; the pre-push hook scanned only the
  # commits it pushed. A draft pull request runs no scan.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The whole history, once a day.
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  # The shared workflow runs gitleaks from this repository's mise.dev.toml
  # through its hooks:secrets:history task.
  secrets:
    if: ${{ !github.event.pull_request.draft }}
    uses: victor-software-house/actions/.github/workflows/secrets.yml@6e9dd33a97807e6e7437cb06b9c0310d674534ea # main, 2026-11-02
    with:
      mise-version: 2026.10.25
      runner: ubuntu-latest
