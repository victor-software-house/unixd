name: Publish

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  MISE_ENV: ci,release

# One group for the runs that can publish, so a manual run and a release never
# run at the same time. Every other run gets a group of its own: a group keeps
# one pending run, and a no-op run would replace a waiting release. A newer
# publishing run still replaces a waiting one; re-run the replaced run to
# publish the version it carried.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
         (github.event.pull_request.merged &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'version-packages'))
        && 'publish' || format('publish-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'version-packages')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: Install locked toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.9
          cache: true
      - uses: victor-software-house/verctl/actions/publish@cbad16c8ca0f610a6a98e30bf3b88e0e0ec5e2f8 # v0.3.5
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
