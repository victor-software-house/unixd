# This repository's settings for the shared workflow policy, which
# `mise run lint:workflow-policy` checks. A starter: the template writes this
# file once and never rewrites it.
#
# Turn a rule off with its copier answer, instead of in this file:
#   copier update --defaults --data 'workflow_policy=[drafts, pins]'
#
# A parameter replaces the policy's default of the same name whole, so restate
# a list in full. The defaults, with a comment on each, are in the actions
# repository's policy/defaults.yaml at the pinned commit.
#
# An exception names the rule, the workflow file and a reason. It may also
# name a job, and within that job a step by its id or name. Without a job it
# covers the whole file. An entry with no reason excepts nothing, and an excepted
# finding is reported as a warning that names the reason.
workflow_policy:
  # mise_env:
  #   profiles: [ci, release]
  # labels:
  #   allowed: [corp-runner-large]
  # concurrency:
  #   endings: ["${{ github.ref }}"]
  exceptions:
    - rule: pins
      file: release.yml
      reason: verctl 0.8.6-rc.4 is a candidate, and the rule reads a release comment only as vX.Y.Z; drop this when the rule takes a semver prerelease
  # exceptions:
  #   - rule: permissions
  #     file: release.yml
  #     reason: publishes the release with the workflow token
  #   - rule: mise_env
  #     file: ci.yml
  #     job: bench
  #     step: probe
  #     reason: measures the dev profile's install
