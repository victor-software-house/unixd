# A bump leaves Cargo.lock stale, and ci.yml runs `cargo package --locked`.
prepare:
  after: [cargo, update, --workspace]
  stage: [Cargo.lock]

# Published in this order: unixd's tests depend on unixd-cache.
packages:
  - name: unixd-cache
    path: crates/unixd-cache/Cargo.toml
  - name: unixd
    path: crates/unixd/Cargo.toml

# The crates version separately, so each gets its own tag and Release.
tags:
  template: "{name}-v{version}"

# Maintainers and Apps a changelog never credits (verctl 0.4.0).
changelog:
  internal_authors:
    - any-victor
    - "github-actions[bot]"
    - "vsh-changeset-version[bot]"
