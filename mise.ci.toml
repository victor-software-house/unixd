# Official env overlay: https://mise.jdx.dev/configuration/environments.html
# Loaded when MISE_ENV contains `ci` (Verify).

[env]
CARGO_INCREMENTAL = "0"
CARGO_TERM_COLOR = "always"

# CI caches a plain target/ with rust-cache, so mbx stays a local build-host tool.
[tools]
rust = { version = "nightly", components = "rustfmt,clippy", mr_boxington = false }
