[workspace]
members = ["crates/unixd", "crates/unixd-cache"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
repository = "https://github.com/victor-software-house/unixd"
authors = ["Victor Araújo <victor@victor-software-house.com>"]

# Each dependency is declared once; members write `workspace = true`.
[workspace.dependencies]
unixd-cache = { version = "0.0", path = "crates/unixd-cache" }
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
] }
humantime-serde = "1.1.1"
indoc = "2.0.7"
nix = { version = "0.31.3", default-features = false, features = [
  "socket",
  "user",
] }
plist = "1.10.1"
rustix = "1.1.5"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = "1.53.1"
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny reports them (`bans.multiple-versions`).
multiple_crate_versions = "allow"

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"
