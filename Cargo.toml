[workspace]
members = ["crates/unixd", "crates/unixd-cache"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
repository = "https://github.com/victor-software-house/unixd"
authors = ["Victor Araújo <victor@victor-software-house.com>"]

# Each dependency is declared once; members write `workspace = true`.
[workspace.dependencies]
unixd-cache = { version = "0.0", path = "crates/unixd-cache" }
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
] }
humantime-serde = "1.1.1"
indoc = "2.0.7"
nix = { version = "0.31.3", default-features = false, features = [
  "socket",
  "user",
] }
plist = "1.10.1"
rustix = "1.1.5"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = "1.53.1"
tokio-util = { version = "0.7.19", features = ["codec", "rt"] }

[workspace.lints.rust]
# deny instead of forbid, because forbid refuses the item-level
# #[expect(unsafe_code, reason = "...")] that a justified exception carries.
unsafe_code = "deny"
# Each unsafe operation inside an unsafe fn sits in its own unsafe block.
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"
# New in Rust 1.100 and warn by default: an unescaped `|` in a table row drops
# cells.
invalid_markdown_table = "deny"

[workspace.lints.cargo]
# Cargo's own lints, new in Rust 1.100. Clippy's -D warnings does not reach
# them, so each group is denied here; correctness is deny already.
# unused_dependencies (style) checks [dependencies] and [build-dependencies]
# from what the compiler used. cargo-machete in `deps` still covers
# [dev-dependencies].
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A function that returns Result reports failure through it instead of a panic.
panic_in_result_fn = "deny"
# map_err(|_| ...) drops the cause; wrap it as a source instead. A site whose
# error carries nothing carries #[expect(clippy::map_err_ignore, reason = "...")].
map_err_ignore = "deny"
# `format!` or `push_str` instead of `+` on a String.
string_add = "deny"
# From and TryFrom instead of as, which can silently truncate or wrap. A site
# that truly needs as carries #[expect(clippy::as_conversions, reason = "...")].
as_conversions = "deny"
# Rc<str> and Rc<[T]> instead of Rc<String> or Rc<Vec<T>>.
rc_buffer = "deny"
# Rc::clone(&x), so a cheap pointer clone reads apart from a deep copy.
clone_on_ref_ptr = "deny"
# Every unsafe block carries a // SAFETY: comment and holds one unsafe
# operation, so each comment justifies exactly one call.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# foo.rs beside foo/, never foo/mod.rs. The Rust Book calls foo.rs the
# idiomatic path and mod.rs the older style (ch07-05, "Alternate File Paths").
# Many files named mod.rs blur together in an editor.
mod_module_files = "deny"
# An item from another module comes in through `use`, and the code names it
# by its last segment, or a function by its module: `fs::read`, never
# `std::fs::read` inline. The default limit is two segments.
absolute_paths = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny fails on them (`bans.multiple-versions`).
multiple_crate_versions = "allow"

# The smallest binary that keeps its speed. Against opt-level 3 with thin LTO,
# a ctl CLI came out 35% smaller and 4% slower.
#
# opt-level "z" takes another 25% off but runs a ledger parse 51% slower. A
# repository whose run time does not matter sets it here. Cargo ignores the
# profiles of a dependency, so a library's consumers see none of this.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"
