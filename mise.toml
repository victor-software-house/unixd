# The latest stable mise is the floor; CI pins the same version.
min_version = "2026.10.17"

[settings]
# mise loads git:: task includes only in experimental mode.
experimental = true
lockfile = true
# The platforms CI and contributors use. Without it, mise install fills every
# tool up to the platforms any tool already records, and rewrites the locks.
lockfile_platforms = ["linux-x64", "macos-arm64"]

# Every tool this root declares must match mise.lock or mise.<env>.lock.
[tool_config]
locked = true

# The toolchain lives here, not in mise.dev.toml, because CI loads only
# MISE_ENV=ci. The stable pin equals rust-toolchain.toml and rust-version.
[tools]
rust = [
  # Pinned stable: build, lint, test.
  { version = "1.99.0", components = "clippy", mr_boxington = true },
  # rustfmt's unstable options, and rustdoc as docs.rs builds it.
  { version = "nightly-2026-09-29", profile = "minimal", components = "rustfmt" },
]
mr-boxington = "1.24.0"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
"github:obi1kenobi/cargo-semver-checks" = "0.51.0"
jq = "1.8.2"
# test runs on nextest: a signal test stops its own process, and the
# sleep-bound tests span three binaries, which nextest runs in parallel.
"github:nextest-rs/nextest" = "cargo-nextest-0.9.143"

# The repository checks (mise-tasks/check/repo.sh).
taplo = "0.10.0"
rumdl = "0.2.79"
typos = "1.51.1"
actionlint = "1.7.12"
# OpenSpec runs on node.
node = "24.21.0"
"npm:@fission-ai/openspec" = "1.14.1"

# The shared Rust tasks read their toolchains from here and name none.
[env]
# format runs rustfmt on the nightly, for its unstable options.
RUSTFMT_TOOLCHAIN = "+nightly-2026-09-29"
# doc builds on the nightly, as docs.rs does.
RUST_NIGHTLY = "nightly-2026-09-29"

# The one gate, composed from the pieces this repository keeps. deny:advisories
# and semver need the network, so they run as their own CI steps.
[tasks.verify]
description = "Every offline check this repository runs"
depends = [
  "check:toolchain",
  "format",
  "lint",
  "check:features",
  "test",
  "test:doc",
  "doc",
  "check:docs",
  "deny",
  "deps",
  "check:versions",
  "check:repo",
]

# mise-tasks/ holds this repository's task fragments and file tasks. An
# includes list replaces the default task dirs, so mise-tasks comes first; add
# pinned git:: catalogs after it.
[task_config]
includes = [
  # Pinned git:: catalogs follow mise-tasks.
  "mise-tasks",
  # `mise run ver`, which the release workflow, check:versions, and semver
  # run. Bump the ref together with the verctl pin in mise.release.toml and
  # the workflow's pin.
  "git::https://github.com/victor-software-house/verctl.git//tasks/ver?ref=v0.5.1",
  "git::https://github.com/victor-software-house/qctl.git//tasks/q?ref=v0.4.4",
  # The shared Rust tasks, at actions main, 2026-10-23.
  "git::https://github.com/victor-software-house/actions.git//tasks/rust.toml?ref=996b7ae482fa620f19834c4bfb0d8466aa05b635",
  # template:check, template:off, and template:on, at actions main, 2026-10-23.
  "git::https://github.com/victor-software-house/actions.git//tasks/template.toml?ref=996b7ae482fa620f19834c4bfb0d8466aa05b635",
]

# The one task here: the last include wins over mise-tasks/, so only an inline
# task replaces the catalog's cargo test. nextest gives the signal test its own
# process and runs the three sleep-bound test binaries in parallel.
[tasks.test]
description = "Unit and integration tests on nextest"
run = "cargo nextest run --all-features --no-tests=warn"
timeout = "30m"
