[package]
name = "unixd"
version = "0.0.0"
description = "Per-user daemon runtime: socket activation, peer identity, bounded framing, drain lifecycle"
keywords = ["daemon", "launchd", "unix-socket", "activation", "tokio"]
categories = ["asynchronous", "os::unix-apis"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []

[dependencies]
futures-util = { version = "0.3.34", default-features = false }
humantime-serde = "1.1.1"
rustix = { version = "1.1.5", features = ["net", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "net", "time"] }
tokio-util = { version = "0.7.19", features = ["codec"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["socket", "user"] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
