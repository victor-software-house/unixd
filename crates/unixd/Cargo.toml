[package]
name = "unixd"
version = "0.0.5"
description = "Per-user daemon runtime: socket activation, peer identity, bounded framing, drain lifecycle"
keywords = ["daemon", "launchd", "unix-socket", "activation", "tokio"]
categories = ["asynchronous", "os::unix-apis"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []

[dependencies]
futures-util.workspace = true
humantime-serde.workspace = true
rustix = { workspace = true, features = ["net", "process"] }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "signal",
  "sync",
  "time",
] }
tokio-util.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
indoc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nix.workspace = true
plist.workspace = true

[dev-dependencies]
unixd-cache.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
