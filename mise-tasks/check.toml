# The shared verify from ctl-core depends on check:features and check:repo by name;
# check:repo comes from the template and runs check:local last.
"check:features" = { description = "Type-check every crate, alone and with all features", run = [
  "cargo check --workspace --all-targets",
  "cargo check --workspace --all-targets --all-features",
] }
"check:runtime-free" = { description = "Prove unixd-cache pulls in no async runtime", run = "! cargo tree -p unixd-cache --edges normal | grep -qw tokio" }
