# Hooks call mise tasks, so a hook runs the same command as CI. mise.dev.toml
# installs them through its postinstall hook; CI never loads that file, so no
# runner has them and no hook needs a CI skip.
#
# Every command runs with MISE_ENV=dev,hooks, from the hookenv anchor on the
# first command, except lockfile below. MISE_ENV replaces the .miserc.toml
# default, so dev is named
# again; a mise.hooks.toml, where a repository has one, disables auto deps
# providers inside hooks.
pre-commit:
  commands:
    format:
      # *.rs matches every depth; **/*.rs misses files at the root.
      glob: "*.rs"
      env: &hookenv { MISE_ENV: "dev,hooks" }
      run: mise run format
    staged-secrets:
      env: *hookenv
      run: mise run hooks:secrets:staged

commit-msg:
  commands:
    committed:
      env: *hookenv
      run: mise run commit-msg {1}

# Hooks are the cheap local tier: no build, test, typecheck or type-aware
# lint. The pull request's CI is the gate and runs all of them.
pre-push:
  commands:
    # Fails when a mise lockfile no longer matches its config. `mise lock
    # --dry-run` writes and installs nothing; `mise install --locked` would
    # download a missing tool. It runs in the dev profile, which reads the
    # committed mise.lock and mise.dev.lock: under any other profile, such as
    # the hooks one, mise assigns the pinned catalogs' task tools to that
    # profile's lockfile, which nothing writes, and reports it stale.
    lockfile:
      env: { MISE_ENV: "dev" }
      run: |
        if ! changes=$(mise lock --dry-run --json); then
          echo "✘ mise lock --dry-run failed; see its error above"
          exit 1
        fi
        if [ "$changes" != "[]" ]; then
          printf '%s\n' "$changes"
          echo "✘ a mise lockfile is stale: run mise lock"
          exit 1
        fi
    # Lints each pushed commit the remote does not have yet, and scans those
    # commits, not the whole history, for credentials. git passes one
    # `<local ref> <local sha> <remote ref> <remote sha>` line per ref on
    # stdin. A delete (all-zero local sha) pushes nothing. Excluding every
    # commit any remote-tracking ref already holds skips main's history,
    # GitHub squash merges included, and commits pushed before, also on a
    # push to a URL or to a remote with no tracking refs yet; the remote sha
    # covers a remote tip that no tracking ref names.
    commits:
      env: *hookenv
      use_stdin: true
      run: |
        zero=0000000000000000000000000000000000000000
        while read -r _ lsha _ rsha; do
          [ "$lsha" = "$zero" ] && continue
          known=""
          if [ "$rsha" != "$zero" ] && git cat-file -e "$rsha^{commit}" 2>/dev/null; then
            known=$rsha
          fi
          commits=$(git rev-list "$lsha" --not --remotes $known)
          [ -n "$commits" ] || continue
          for commit in $commits; do
            mise run commits "$commit" </dev/null || exit 1
          done
          mise run hooks:secrets:history --log-opts="$lsha --not --remotes $known" </dev/null || exit 1
        done
