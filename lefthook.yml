# Hooks call mise tasks, so a hook runs the same command as CI. mise.dev.toml
# installs the hooks through its postinstall hook. CI never loads that file,
# so no runner has them and no hook needs a CI skip.
#
# Every command runs with MISE_ENV=dev,hooks, from the hookenv anchor on the
# first command, except lockfile below. MISE_ENV replaces the .miserc.toml
# default, so dev is named
# again; a mise.hooks.toml, where a repository has one, disables auto deps
# providers inside hooks.
pre-commit:
  commands:
    format:
      # *.rs matches every depth; **/*.rs misses files at the root.
      glob: "*.rs"
      env: &hookenv { MISE_ENV: "dev,hooks" }
      run: mise run format
    staged-secrets:
      env: *hookenv
      run: mise run hooks:secrets:staged

commit-msg:
  commands:
    committed:
      env: *hookenv
      run: mise run commit-msg {1}

# Hooks are the cheap local tier: no build, test, typecheck or type-aware
# lint. The pull request's CI is the gate and runs all of them.
pre-push:
  parallel: true
  # Each file check runs a check:repo task on the files the push changes:
  # lefthook's {push_files}, the files between HEAD and @{push}, as the
  # working tree holds them. A command's glob narrows them, and a command
  # whose glob matches no pushed file is skipped. lefthook's default glob
  # matcher reads * across directories, so *.toml matches at every depth,
  # and openspec/** needs openspec/* beside it for the files at its top.
  commands:
    markdown:
      glob: "*.{md,markdown,mkd,mkdn,mdown,mdwn,mdx,qmd,rmd}"
      env: *hookenv
      run: mise run lint:md {push_files}
    toml:
      glob: "*.toml"
      env: *hookenv
      run: mise run format:toml {push_files}
    # typos and Vale pick their own files from the push: .typos.toml and the
    # ProseStyle settings choose, code included.
    typos:
      env: *hookenv
      run: mise run lint:typos {push_files}
    specs:
      glob: ["openspec/*", "openspec/**/*"]
      env: *hookenv
      # Quoted: ":::" holds ": ", which YAML reads as a mapping.
      run: "mise run specs ::: specs:budget"
    workflows:
      glob: [".github/*", ".github/**/*"]
      env: *hookenv
      run: "mise run lint:workflows ::: lint:workflow-policy"
  # Each script, .lefthook/pre-push/<name>, runs one mise task on git's
  # pre-push lines, so it checks every pushed ref, not only HEAD.
  scripts:
    # Fails when a mise lockfile no longer matches its config
    # (mise-tasks/hooks/lockfile.sh). The task checks each committed
    # mise.<profile>.toml's lock in turn, except the hooks profile's, in a
    # worktree of each pushed commit, from git's pre-push lines on stdin; the
    # env here only sets the profiles mise runs the task itself in.
    lockfile.sh:
      runner: sh
      env: { MISE_ENV: "dev" }
      use_stdin: true
    # Lints each pushed commit the remote does not have yet. It also scans
    # those commits for credentials, instead of the whole history. The task,
    # mise-tasks/hooks/pushed.sh, reads git's pre-push lines on stdin.
    commits.sh:
      runner: sh
      env: *hookenv
      use_stdin: true
