# CI already runs `mise run verify`. Do not arm hooks on runners.
pre-commit:
  skip:
    - run: test -n "$CI"
  commands:
    # TODO(UXD-008): remove once a mise release includes jdx/mise#14316.
    warm-remote-tasks:
      priority: 1
      run: env -u GIT_INDEX_FILE mise tasks ls >/dev/null
    format:
      glob: "**/*.rs"
      run: mise run format

commit-msg:
  skip:
    - run: test -n "$CI"
  commands:
    # TODO(UXD-008): remove once a mise release includes jdx/mise#14316.
    warm-remote-tasks:
      priority: 1
      run: env -u GIT_INDEX_FILE mise tasks ls >/dev/null
    committed:
      run: mise run commit-msg {1}

pre-push:
  skip:
    - run: test -n "$CI"
  commands:
    lockfile:
      run: mise install --locked
    committed:
      run: mise run commits
    verify:
      run: mise run verify
