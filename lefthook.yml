# CI already runs `mise run verify`. Do not arm hooks on runners.
pre-commit:
  skip:
    - run: test -n "$CI"
  commands:
    format:
      glob: "**/*.rs"
      run: mise run format

commit-msg:
  skip:
    - run: test -n "$CI"
  commands:
    committed:
      run: mise run commit-msg {1}

pre-push:
  skip:
    - run: test -n "$CI"
  commands:
    committed:
      run: mise run commits
    verify:
      run: mise run verify
